# Use together with compose.yaml. WordPress remains loopback-only; Caddy exposes HTTPS.
services:
  wordpress:
    environment: &production_environment
      WORDPRESS_CONFIG_EXTRA: |
        define('DISALLOW_FILE_EDIT', true);
        define('WP_ENVIRONMENT_TYPE', 'production');
        define('FORCE_SSL_ADMIN', true);
        define('DISABLE_WP_CRON', true);
        define('SW_CHAT_BOT_URL', getenv('SW_CHAT_BOT_URL') ?: '');
        define('SW_CHAT_BOT_KEY', getenv('SW_CHAT_BOT_KEY') ?: '');
  cli:
    environment:
      <<: *production_environment
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
